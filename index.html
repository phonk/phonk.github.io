<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>phonk</title>
<meta name="description" content="There are no things when there are no things. But sometimes there are.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital@0;1&family=IBM+Plex+Sans:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
<style>
  /* the same world as sempre, lamiera and deriva */
  :root {
    --bg: #02040F;
    --ink: #E5DADA;
    --faint: #968E96;
    --thing: #968E96;
    --amber: #E59500;
    --font: "Helvetica Neue", "IBM Plex Sans", Helvetica, Arial, sans-serif;
    color-scheme: dark;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font);
    font-weight: 300;
    overflow: hidden;
    cursor: crosshair;
    -webkit-font-smoothing: antialiased;
  }

  main {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    padding: 0 16px;
    pointer-events: none;
  }

  .frase {
    max-width: 34ch;
    margin-inline: auto;
    font-family: "EB Garamond", Georgia, serif;
    font-weight: 400;
    text-wrap: balance;
    text-align: center;
    font-size: clamp(1.25rem, 3.2vw, 1.9rem);
    line-height: 1.5;
    position: relative;
    z-index: 2;
  }
  .frase span { display: block; }
  .frase .ma {
    font-style: italic;
    opacity: 0;
    animation: arriva 1.8s ease .6s forwards;
  }

  /* the things that are */
  .cose-vere {
    list-style: none;
    display: flex;
    justify-content: center;
    gap: clamp(2rem, 6vw, 4.5rem);
    margin-top: clamp(2.6rem, 7vh, 4.5rem);
    pointer-events: auto;
    opacity: 0;
    animation: arriva 2.4s ease 3.2s forwards;
    position: relative;
    z-index: 2;
  }
  .cose-vere a {
    display: block;
    text-align: center;
    color: var(--ink);
    text-decoration: none;
    cursor: pointer;
  }
  .cose-vere .n {
    display: inline-block;
    font-style: italic;
    font-size: clamp(1.2rem, 2.2vw, 1.45rem);
    line-height: 1.2;
    background: linear-gradient(currentColor, currentColor) 50% 100% / 0 1px no-repeat;
    transition: background-size .6s ease, color .6s ease;
    padding-bottom: 3px;
  }
  .cose-vere a:hover .n, .cose-vere a:focus-visible .n { background-size: 100% 1px; color: var(--amber); }
  .cose-vere a:focus-visible { outline: none; }
  .cose-vere .d {
    display: block;
    margin-top: 6px;
    font-size: 0.86rem;
    line-height: 1.4;
    color: var(--faint);
    max-width: 15ch;
    margin-inline: auto;
    transition: color .6s;
  }
  .cose-vere a:hover .d { color: var(--ink); }
  @media (max-width: 560px) {
    .cose-vere { flex-direction: column; gap: 1.5rem; margin-top: 2.4rem; }
    .cose-vere .d { max-width: none; }
  }

  .cosa {
    position: fixed;
    font-style: italic;
    font-size: clamp(0.9rem, 1.6vw, 1.05rem);
    color: var(--thing);
    font-weight: 300;
    white-space: nowrap;
    pointer-events: none;
    opacity: 0;
    transform: translate(-50%, -50%);
    animation: ce var(--durata, 7s) ease-in-out forwards;
    z-index: 1;
  }

  .firma {
    position: fixed;
    bottom: 18px;
    left: 0; right: 0;
    text-align: center;
    font-size: 0.8rem;
    letter-spacing: 0.2em;
    color: var(--faint);
    pointer-events: auto;
  }
  .firma a { color: inherit; text-decoration: none; transition: color .4s; }
  .firma a:hover, .firma a:focus-visible { color: var(--ink); outline: none; }

  @keyframes arriva { to { opacity: 1; } }
  @keyframes ce {
    0%   { opacity: 0;    filter: blur(3px); }
    25%  { opacity: 0.9;  filter: blur(0); }
    70%  { opacity: 0.75; filter: blur(0); }
    100% { opacity: 0;    filter: blur(2px); }
  }

  @media (prefers-reduced-motion: reduce) {
    .frase .ma { animation: none; opacity: 1; }
    .cosa { animation-duration: 0.01s; }
    .cose-vere { animation: none; opacity: 1; }
  }
</style>
</head>
<body>
<main>
  <div>
    <p class="frase">
      <span>There are no things when there are no things.</span>
      <span class="ma">But sometimes there are.</span>
    </p>
    <ul class="cose-vere">
      <li><a href="/sempre/"><span class="n">sempre</span><span class="d">a tambura drone to play over</span></a></li>
      <li><a href="/lamiera/"><span class="n">lamiera</span><span class="d">a handpan under your fingers</span></a></li>
      <li><a href="/tuva/"><span class="n">tuva</span><span class="d">a formant lab for the Yamaha FS1R</span></a></li>
      <li><a href="/deriva/"><span class="n">deriva</span><span class="d">loops that slowly drift apart</span></a></li>
    </ul>
  </div>
</main>

<p class="firma"><a href="https://github.com/phonk">phonk</a></p>

<script>
  // The things that sometimes are.
  const cose = [
    "a drone in D", "a sheet of metal", "a Dorian mode", "a flatwound string",
    "an oscillator that doesn't know it is one", "the hum of the fridge",
    "a note held too long", "a reverb without a room",
    "rain on a tin roof", "a forgotten bass",
    "a kick that arrives late", "the silence after the silence",
    "a formant", "a heartbeat",
    "snow on the Bisalta", "a tape slowing down",
    "half a sentence", "nothing, but only for a moment", "an idea at 3 a.m.",
    "two loops that never meet again",
    "a bell from the next village", "fog on the Stura",
    "where the Gesso meets the Stura", "a bowl still ringing",
    "a radio between stations", "a string tuned a little flat",
    "a fan that hums a fifth", "a chord nobody resolves",
    "dust on a record", "the click before the music",
    "a valve amp warming up", "a bass note felt more than heard",
    "an echo that answers late", "water in the pipes at night",
    "the room after the guests leave", "a loop someone forgot to stop",
    "the kitchen clock, louder at night", "a key you never play in",
    "breath on a cold window", "a thought that comes back in another key"
  ];

  const ridotto = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  let ultima = -1;

  function scegli() {
    let i;
    do { i = Math.floor(Math.random() * cose.length); } while (i === ultima);
    ultima = i;
    return cose[i];
  }

  function appare(x, y) {
    if (ridotto) return;
    let el;
    el = document.createElement("span");
    el.className = "cosa";
    el.textContent = scegli();
    // away from the centre, where the sentence lives
    if (x === undefined) {
      const lato = Math.random() < 0.5 ? -1 : 1;
      if (innerWidth < 700) {
        // narrow screens: only in the empty band at the top
        x = 20 + Math.random() * 60;
        y = 5 + Math.random() * 15;
      } else {
        x = 50 + lato * (20 + Math.random() * 14);
        y = 12 + Math.random() * 76;
      }
      el.style.left = x + "vw";
      el.style.top = y + "vh";
    } else {
      el.style.left = x + "px";
      el.style.top = y + "px";
    }
    el.style.setProperty("--durata", (5 + Math.random() * 5).toFixed(1) + "s");
    document.body.appendChild(el);
    // keep every thing inside the screen, 16px from the edges
    const b = el.getBoundingClientRect(), m = 16;
    if (b.left < m) el.style.left = (m + b.width / 2) + "px";
    else if (b.right > innerWidth - m) el.style.left = (innerWidth - m - b.width / 2) + "px";
    if (b.top < m) el.style.top = (m + b.height / 2) + "px";
    else if (b.bottom > innerHeight - 56) el.style.top = (innerHeight - 56 - b.height / 2) + "px";
    // never on top of the sentence or the links: try a few other spots
    if (x === undefined) {
      const busy = [...document.querySelectorAll(".frase, .cose-vere")].map(n => n.getBoundingClientRect());
      const hits = r => busy.some(q => r.left < q.right + 12 && r.right > q.left - 12 && r.top < q.bottom + 12 && r.bottom > q.top - 12);
      for (let k = 0; k < 8 && hits(el.getBoundingClientRect()); k++) {
        el.style.left = (12 + Math.random() * 76) + "vw";
        el.style.top = (6 + Math.random() * 84) + "vh";
      }
      if (hits(el.getBoundingClientRect())) { el.remove(); return; }
    }
    el.addEventListener("animationend", () => el.remove());
  }

  // Sometimes: never on a schedule.
  function forse() {
    if (Math.random() < 0.6) appare();
    setTimeout(forse, 2500 + Math.random() * 6000);
  }
  setTimeout(forse, 4500);

  // And sometimes you bring them.
  document.addEventListener("pointerdown", e => {
    if (e.target.closest("a")) return;
    appare(e.clientX, e.clientY);
  });
</script>
<script data-goatcounter="https://phonk.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
</body>
</html>

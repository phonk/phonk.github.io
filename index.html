<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>phonk</title>
<meta name="description" content="There are no things when there are no things. But sometimes there are.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4f1ea;
    --ink: #1d1c1a;
    --faint: #8a857b;
    --thing: #6b5e4a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121211;
      --ink: #e8e4da;
      --faint: #6f6b63;
      --thing: #b8a888;
    }
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: "EB Garamond", Georgia, serif;
    overflow: hidden;
    cursor: crosshair;
    -webkit-font-smoothing: antialiased;
  }

  main {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    padding: 0 16px;
    pointer-events: none;
  }

  .frase {
    max-width: 34ch;
    text-wrap: balance;
    text-align: center;
    font-size: clamp(1.25rem, 3.2vw, 1.9rem);
    line-height: 1.5;
    position: relative;
    z-index: 2;
  }
  .frase span { display: block; }
  .frase .ma {
    font-style: italic;
    opacity: 0;
    animation: arriva 2.4s ease 1.6s forwards;
  }

  .cosa {
    position: fixed;
    font-style: italic;
    font-size: clamp(0.9rem, 1.6vw, 1.05rem);
    color: var(--thing);
    white-space: nowrap;
    pointer-events: none;
    opacity: 0;
    transform: translate(-50%, -50%);
    animation: ce var(--durata, 7s) ease-in-out forwards;
    z-index: 1;
  }

  /* things that, when they are there, can be entered */
  .cosa.porta {
    pointer-events: auto;
    cursor: pointer;
    color: var(--ink);
    text-decoration: none;
  }
  .cosa.porta small {
    display: block;
    text-align: center;
    font-style: normal;
    font-size: 0.68em;
    letter-spacing: 0.3em;
    color: var(--faint);
    margin-top: 2px;
  }
  .cosa.porta:hover { animation-play-state: paused; }
  .cosa.porta:hover small { color: var(--ink); }

  .firma {
    position: fixed;
    bottom: 18px;
    left: 0; right: 0;
    text-align: center;
    font-size: 0.85rem;
    letter-spacing: 0.18em;
    color: var(--faint);
    pointer-events: auto;
  }
  .firma a { color: inherit; text-decoration: none; transition: color .4s; }
  .firma a:hover, .firma a:focus-visible { color: var(--ink); outline: none; }
  .firma .dentro {
    display: inline-block;
    max-width: 0;
    overflow: hidden;
    vertical-align: bottom;
    white-space: nowrap;
    opacity: 0;
    transition: max-width 1.2s ease, opacity 1.2s ease;
  }
  .firma:hover .dentro, .firma:focus-within .dentro, .firma.aperta .dentro {
    max-width: 30em;
    opacity: 1;
  }
  .firma .dentro a { margin-left: 1.4em; font-style: italic; letter-spacing: 0.08em; }

  @keyframes arriva { to { opacity: 1; } }
  @keyframes ce {
    0%   { opacity: 0;    filter: blur(3px); }
    25%  { opacity: 0.9;  filter: blur(0); }
    70%  { opacity: 0.75; filter: blur(0); }
    100% { opacity: 0;    filter: blur(2px); }
  }

  @media (prefers-reduced-motion: reduce) {
    .frase .ma { animation: none; opacity: 1; }
    .cosa { animation-duration: 0.01s; }
    .firma .dentro { transition: none; }
  }
</style>
</head>
<body>
<main>
  <p class="frase">
    <span>There are no things when there are no things.</span>
    <span class="ma">But sometimes there are.</span>
  </p>
</main>

<p class="firma"><a class="nome" href="https://github.com/phonk">phonk</a><span class="dentro"><a href="/sempre/">sempre</a><a href="/lamiera/">lamiera</a><a href="/tuva/">tuva</a></span></p>

<script>
  // The things that sometimes are.
  const cose = [
    "a drone in D", "a sheet of metal", "a Dorian mode", "a flatwound string",
    "an oscillator that doesn't know it is one", "the hum of the fridge",
    "a note held too long", "a reverb without a room",
    "rain on a tin roof", "a forgotten bass",
    "a kick that arrives late", "the silence after the silence",
    "a formant", "a heartbeat", "an A at 432, maybe",
    "snow on the Bisalta", "a tape slowing down",
    "half a sentence", "nothing, but only for a moment", "an idea at 3 a.m."
  ];

  // A few things are doors.
  const porte = [
    { frase: "a drone that never ends",      nome: "sempre",  href: "/sempre/" },
    { frase: "a sheet of metal, still ringing", nome: "lamiera", href: "/lamiera/" },
    { frase: "a throat full of formants",    nome: "tuva",    href: "/tuva/" }
  ];
  let ultimaPorta = -1;

  const ridotto = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  let ultima = -1;

  function scegli() {
    let i;
    do { i = Math.floor(Math.random() * cose.length); } while (i === ultima);
    ultima = i;
    return cose[i];
  }

  function appare(x, y, porta) {
    if (ridotto) return;
    let el;
    if (porta) {
      const aperte = [...document.querySelectorAll(".porta")].map(a => a.getAttribute("href"));
      const libere = porte.map((p, k) => k).filter(k => k !== ultimaPorta && !aperte.includes(porte[k].href));
      if (!libere.length) return appare(x, y, false);
      const i = libere[Math.floor(Math.random() * libere.length)];
      ultimaPorta = i;
      el = document.createElement("a");
      el.className = "cosa porta";
      el.href = porte[i].href;
      el.textContent = porte[i].frase;
      const n = document.createElement("small");
      n.textContent = porte[i].nome;
      el.appendChild(n);
    } else {
      el = document.createElement("span");
      el.className = "cosa";
      el.textContent = scegli();
    }
    // away from the centre, where the sentence lives
    if (x === undefined) {
      const lato = Math.random() < 0.5 ? -1 : 1;
      if (innerWidth < 700) {
        // narrow screens: above or below the sentence
        x = 20 + Math.random() * 60;
        y = lato < 0 ? 8 + Math.random() * 28 : 60 + Math.random() * 26;
      } else {
        x = 50 + lato * (20 + Math.random() * 14);
        y = 12 + Math.random() * 76;
      }
      el.style.left = x + "vw";
      el.style.top = y + "vh";
    } else {
      el.style.left = x + "px";
      el.style.top = y + "px";
    }
    el.style.setProperty("--durata", porta ? (11 + Math.random() * 4).toFixed(1) + "s"
                                            : (5 + Math.random() * 5).toFixed(1) + "s");
    document.body.appendChild(el);
    // keep every thing inside the screen, 16px from the edges
    const b = el.getBoundingClientRect(), m = 16;
    if (b.left < m) el.style.left = (m + b.width / 2) + "px";
    else if (b.right > innerWidth - m) el.style.left = (innerWidth - m - b.width / 2) + "px";
    if (b.top < m) el.style.top = (m + b.height / 2) + "px";
    else if (b.bottom > innerHeight - 56) el.style.top = (innerHeight - 56 - b.height / 2) + "px";
    el.addEventListener("animationend", () => el.remove());
  }

  // Sometimes: never on a schedule.
  function forse() {
    if (Math.random() < 0.6) appare(undefined, undefined, Math.random() < 0.3);
    setTimeout(forse, 2500 + Math.random() * 6000);
  }
  setTimeout(forse, 4500);

  // On touch screens the first tap on "phonk" opens it instead of leaving.
  const firma = document.querySelector(".firma");
  document.querySelector(".firma .nome").addEventListener("click", e => {
    if (matchMedia("(hover: none)").matches && !firma.classList.contains("aperta")) {
      e.preventDefault();
      firma.classList.add("aperta");
    }
  });

  // And sometimes you bring them.
  document.addEventListener("pointerdown", e => {
    if (e.target.closest("a")) return;
    appare(e.clientX, e.clientY, Math.random() < 0.25);
  });
</script>
<script data-goatcounter="https://phonk.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
</body>
</html>
